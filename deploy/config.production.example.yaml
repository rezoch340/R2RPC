# R2RPC 双域名生产样例：
#   控制台 https://console.example.com
#   API/WS https://rpc.example.com / wss://rpc.example.com
# 使用前必须替换域名、JWT secret、管理员初始密码和数据库密码，并同步 PostgreSQL 初始化。
app:
  port: 3000
  globalPrefix: ''
  publicWsUrl: wss://rpc.example.com/api/client/ws
  openApiEnabled: false
  # API 只接受宿主机 Nginx/OpenResty 转发，因此只信任紧邻的一跳。
  trustedProxyHops: 1
  corsOrigins:
    - https://console.example.com

frontend:
  apiUrl: https://rpc.example.com
  apiPort: 443
  allowedDevOrigins: []

db:
  host: postgres
  port: 5432
  user: r2rpc
  password: r2rpc
  database: r2rpc

redis:
  host: redis
  port: 6379
  password: null
  db: 0

jwt:
  secret: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  expiresIn: 7d
  authorizationCacheTtlSeconds: 60

manticore:
  url: http://manticore:9308

bootstrap:
  admin:
    username: admin
    password: REPLACE_WITH_A_LONG_RANDOM_ADMIN_PASSWORD

performance:
  baseUrl: http://api:3000
  projectName: cn-nodes
  virtualDeviceCount: 4
  durationSeconds: 20
  warmupSeconds: 3
  concurrency: 16
  targetRequestsPerSecond: 80
  requestTimeoutMilliseconds: 5000
  maximumErrorRate: 0.01
  maximum95thPercentileLatencyMilliseconds: 750
  minimumThroughputRequestsPerSecond: 60
  resultFile: /app/performance-results/latest.json

retention:
  rawRetentionDays: 3
  keepLatestPerScope: 100
  aggregateRetentionDays: 30
