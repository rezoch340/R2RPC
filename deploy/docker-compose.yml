# RER0RPC 基础设施:PostgreSQL(权威库)+ Redis(缓存/队列/锁)+ Manticore(payload 原文/全文)
# 端口与 backend/config.yaml 对齐。用法见 deploy/README.md 或跑 deploy/dev-up.sh
services:
  postgres:
    image: postgres:16-alpine
    container_name: rer0rpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rer0rpc
      POSTGRES_PASSWORD: rer0rpc
      POSTGRES_DB: rer0rpc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rer0rpc -d rer0rpc"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: rer0rpc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  manticore:
    image: manticoresearch/manticore:latest
    container_name: rer0rpc-manticore
    restart: unless-stopped
    ports:
      - "${MANTICORE_HTTP_PORT:-9308}:9308"   # HTTP JSON API
      - "${MANTICORE_MYSQL_PORT:-9306}:9306"   # MySQL 协议
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - manticoredata:/var/lib/manticore

  frontend:
    build:
      context: ../frontend
    container_name: rer0rpc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./frontend.yaml:/app/frontend.yaml:ro

volumes:
  pgdata:
  redisdata:
  manticoredata:
