x-backend-image: &backend-image
  build:
    context: ./backend
  image: rer0rpc-backend:local

x-application-config: &application-config
  volumes:
    - ./deploy/config.yaml:/app/config.yaml:ro

x-postgres-resources: &postgres-resources
  cpus: "0.65"
  mem_limit: 640m
  pids_limit: 128

x-redis-resources: &redis-resources
  cpus: "0.25"
  mem_limit: 256m
  pids_limit: 64

x-manticore-resources: &manticore-resources
  cpus: "0.65"
  mem_limit: 640m
  pids_limit: 128

x-migration-resources: &migration-resources
  cpus: "0.15"
  mem_limit: 192m
  pids_limit: 64

x-seed-resources: &seed-resources
  cpus: "0.15"
  mem_limit: 192m
  pids_limit: 64

x-api-resources: &api-resources
  cpus: "0.85"
  mem_limit: 704m
  pids_limit: 256

x-worker-resources: &worker-resources
  cpus: "0.40"
  mem_limit: 384m
  pids_limit: 192

x-frontend-resources: &frontend-resources
  cpus: "0.30"
  mem_limit: 320m
  pids_limit: 128

x-performance-resources: &performance-resources
  cpus: "0.60"
  mem_limit: 512m
  pids_limit: 128

services:
  postgres:
    <<: *postgres-resources
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rer0rpc
      POSTGRES_PASSWORD: rer0rpc
      POSTGRES_DB: rer0rpc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rer0rpc -d rer0rpc"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    <<: *redis-resources
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  manticore:
    <<: *manticore-resources
    image: manticoresearch/manticore:latest
    restart: unless-stopped
    ports:
      - "9308:9308"
      - "9306:9306"
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - manticore-data:/var/lib/manticore
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9308/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  migration:
    <<: [*backend-image, *application-config, *migration-resources]
    command: ["node", "dist/scripts/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: [*backend-image, *application-config, *seed-resources]
    command: ["node", "dist/scripts/seed-admin.js"]
    restart: "no"
    depends_on:
      migration:
        condition: service_completed_successfully

  api:
    <<: [*backend-image, *application-config, *api-resources]
    command: ["node", "dist/main.js"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      manticore:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/docs').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: [*backend-image, *application-config, *worker-resources]
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      manticore:
        condition: service_healthy

  frontend:
    <<: *frontend-resources
    build:
      context: ./frontend
    image: rer0rpc-frontend:local
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./deploy/config.yaml:/app/config.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/login').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  performance:
    <<: [*backend-image, *performance-resources]
    profiles:
      - performance
    command: ["node", "dist/scripts/performance.js"]
    restart: "no"
    volumes:
      - ./deploy/config.yaml:/app/config.yaml:ro
      - ./performance-results:/app/performance-results
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  manticore-data:
