name: 功能建议
description: 提议明确边界、可验证的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前用户流程和缺口，不要只给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 权限、租户和协议边界
      description: 说明 Access Token、Device Token、功能组、clientId、后台权限和兼容性影响。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 给出可通过公开 HTTP、WebSocket、SDK 或浏览器验证的结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
