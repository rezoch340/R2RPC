name: 持续集成

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端质量门禁
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: 安装后端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查命名与 ESLint
        run: pnpm lint:check

      - name: 检查代码格式
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.{js,ts}"

      - name: 构建后端
        run: pnpm build

      - name: 运行后端单元测试
        run: pnpm test

      - name: 校验 OpenAPI 与数据库迁移无漂移
        shell: bash
        env:
          CONFIG_FILE: ../config.example.yaml
        run: |
          pnpm openapi:gen
          pnpm db:generate
          generated_changes="$(git status --porcelain -- drizzle ../docs/openapi.yaml)"
          if [[ -n "$generated_changes" ]]; then
            echo "::error::OpenAPI 或 Drizzle 生成结果未提交"
            printf '%s\n' "$generated_changes"
            exit 1
          fi

  frontend:
    name: 前端质量门禁
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查命名与 ESLint
        run: pnpm lint

      - name: 构建前端
        run: pnpm build

  end-to-end:
    name: 后端与前端黑盒验收
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs:
      - backend
      - frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: 安装后端依赖
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: 安装前端依赖与 Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: 准备 Compose 配置
        run: cp deploy/config.example.yaml deploy/config.yaml

      - name: 校验并启动完整服务
        run: |
          docker compose config --quiet
          docker compose up --detach --build --wait api worker frontend
          docker compose ps

      - name: 运行后端 HTTP/WebSocket 黑盒
        working-directory: backend
        env:
          BASE_URL: http://127.0.0.1:3000
        run: pnpm smoke

      - name: 运行前端浏览器黑盒
        working-directory: frontend
        env:
          CONFIG_FILE: ../config.example.yaml
          E2E_FRONTEND_PORT: 3001
          E2E_REUSE_EXISTING_SERVER: "true"
        run: pnpm test:e2e

      - name: 输出失败服务日志
        if: failure()
        run: docker compose logs --no-color

      - name: 上传 Playwright 失败制品
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-failure
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: 清理 Compose
        if: always()
        run: docker compose down --volumes --remove-orphans
