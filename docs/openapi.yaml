openapi: 3.0.0
paths:
  /device-tokens:
    post:
      operationId: DeviceTokenController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceTokenDto'
      responses:
        '201':
          description: 生成 device token(返回明文,供 SDK 配置)成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 生成 device token(返回明文,供 SDK 配置)
      tags:
        - device-token
      description: 生成 device token(返回明文,供 SDK 配置)。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
    get:
      operationId: DeviceTokenController_list
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 1000000
            default: 1
            type: integer
        - name: pageSize
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: integer
        - name: id
          required: false
          in: query
          description: 令牌数据库编号精确匹配
          schema:
            type: number
        - name: name
          required: false
          in: query
          description: 令牌名称模糊匹配
          schema:
            type: string
        - name: project
          required: false
          in: query
          description: 所挂功能组名称,完整名等值匹配
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - active
              - revoked
      responses:
        '200':
          description: 列表:device token(含明文、project 名、在线设备数),服务端筛选分页成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 列表:device token(含明文、project 名、在线设备数),服务端筛选分页
      tags:
        - device-token
      description: 列表:device token(含明文、project 名、在线设备数),服务端筛选分页。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /device-tokens/{id}/projects:
    patch:
      operationId: DeviceTokenController_updateProjects
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceTokenProjectsDto'
      responses:
        '200':
          description: 替换 device token 的功能组作用域成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 替换 device token 的功能组作用域
      tags:
        - device-token
      description: 替换 device token 的功能组作用域。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /device-tokens/{id}/revoke:
    post:
      operationId: DeviceTokenController_revoke
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '201':
          description: 撤销 device token成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 撤销 device token
      tags:
        - device-token
      description: 撤销 device token。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /device-tokens/{id}:
    delete:
      operationId: DeviceTokenController_delete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: 删除 device token(软删,与撤销正交)成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 删除 device token(软删,与撤销正交)
      tags:
        - device-token
      description: 删除 device token(软删,与撤销正交)。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /projects:
    get:
      operationId: ProjectsController_list
      parameters: []
      responses:
        '200':
          description: 功能组列表成功。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 功能组列表
      tags:
        - projects
      description: 功能组列表。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
    post:
      operationId: ProjectsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: 创建功能组成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 创建功能组
      tags:
        - projects
      description: 创建功能组。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /projects/info:
    get:
      operationId: ProjectsController_info
      parameters: []
      responses:
        '200':
          description: 功能组派生统计(设备数/在线/近7天/成功率/运行态)成功。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 功能组派生统计(设备数/在线/近7天/成功率/运行态)
      tags:
        - projects
      description: 功能组派生统计(设备数/在线/近7天/成功率/运行态)。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /projects/{id}:
    delete:
      operationId: ProjectsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: 删除功能组成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 删除功能组
      tags:
        - projects
      description: 删除功能组。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /projects/{id}/enabled:
    post:
      operationId: ProjectsController_setEnabled
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnabledDto'
      responses:
        '201':
          description: 启用/停用功能组(停用后 invoke 拒派)成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnabledResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 启用/停用功能组(停用后 invoke 拒派)
      tags:
        - projects
      description: 启用/停用功能组(停用后 invoke 拒派)。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /metrics/overview:
    get:
      operationId: MetricsController_overview
      parameters: []
      responses:
        '200':
          description: 指标总览(总量 / 成功失败 / 平均延迟 / 分状态 / 分组)成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
