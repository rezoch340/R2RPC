info:
  title: R2RPC API
  description: R2RPC 管理控制面、调用方 RPC 与监控查询的 HTTP API。设备长连接协议使用 WebSocket，另见项目协议文档。
  version: 0.1.1
  contact:
    name: R2RPC Contributors
    url: https://github.com/rezoch340/R2RPC
    email: ''
  license:
    name: UNLICENSED
    url: https://github.com/rezoch340/R2RPC/blob/main/LICENSE
tags:
  - name: auth
    description: 后台账号登录和当前身份
  - name: users
    description: 后台账号管理
  - name: rbac
    description: 权限组、权限和用户授权
  - name: projects
    description: 功能组管理与运行统计
  - name: device-token
    description: 设备上线凭证
  - name: access-token
    description: RPC 调用方凭证
  - name: devices
    description: 设备持久态
  - name: rpc
    description: 公开 RPC 调用和后台手动调试
  - name: monitor
    description: 请求日志与 AppAudit 详情
  - name: metrics
    description: 请求和设备聚合指标
  - name: system-logs
    description: 后台系统操作审计
servers:
  - url: /
    description: 当前部署
components:
  securitySchemes:
    adminJwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: 后台登录接口签发的管理员 JWT。
    accessToken:
      scheme: bearer
      bearerFormat: R2RPC Access Token
      type: http
      description: 访问令牌管理页面生成的 rk_ 前缀 Access Token。
  schemas:
    CreateDeviceTokenDto:
      type: object
      properties:
        name:
          type: string
        projects:
          type: array
          items:
            type: string
        description:
          type: string
      required:
        - name
        - projects
    UpdateDeviceTokenProjectsDto:
      type: object
      properties:
        projects:
          description: 更新后的完整功能组名称列表
          type: array
          items:
            type: string
      required:
        - projects
    CreateProjectDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 255
      required:
        - name
    SetEnabledDto:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    CreateRoleDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 255
      required:
        - name
    UpdateRoleDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 255
    CreatePermissionDto:
      type: object
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 64
        subject:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 255
      required:
        - action
        - subject
    AttachPermissionDto:
      type: object
      properties:
        permissionId:
          type: number
          minimum: 1
      required:
        - permissionId
    AssignRoleDto:
      type: object
      properties:
        roleId:
          type: number
          minimum: 1
      required:
        - roleId
    CreateUserDto:
      type: object
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 128
        role:
          type: string
          enum:
            - admin
            - operator
          default: admin
        description:
          type: string
          maxLength: 255
      required:
        - username
        - password
    UpdateUserDto:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
      required:
        - description
    UpdatePasswordDto:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 128
      required:
        - password
    LoginDto:
      type: object
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 128
      required:
        - username
        - password
    CreateAccessTokenDto:
      type: object
      properties:
        name:
          type: string
        projects:
          type: array
          items:
            type: string
        expiresAt:
          type: string
        maximumUsageCount:
          type: number
          minimum: 1
          maximum: 2147483647
          description: 可选最大 RPC 调用次数；达到后令牌失效。
        description:
          type: string
      required:
        - name
        - projects
    UpdateAccessTokenDto:
      type: object
      properties:
        projects:
          description: 更新后的完整功能组名称列表。
          type: array
          items:
            type: string
        expiresAt:
          type: object
          nullable: true
          description: 新的绝对过期时间；null 表示取消时间限制。
        maximumUsageCount:
          type: object
          nullable: true
          minimum: 1
          maximum: 2147483647
          description: 新的最大 RPC 调用次数；null 表示取消次数限制。
    UpdateAccessTokenProjectsDto:
      type: object
      properties:
        projects:
          description: 更新后的完整功能组名称列表
          type: array
          items:
            type: string
      required:
        - projects
    InvokeDto:
      type: object
      properties:
        timeoutSeconds:
          type: number
          description: 超时秒数
          default: 20
        payload:
          type: object
          description: 调用负载(扁平对象)
      required:
        - payload
    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
        - timestamp
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
              example: 请求参数非法
            - type: array
              items:
                type: string
              example:
                - name must be a string
            - type: object
              additionalProperties: true
              description: Nest HttpException 的结构化响应，例如 statusCode/message/error。
        timestamp:
          type: string
          format: date-time
    DeletedResult:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
          enum:
            - true
    AttachedResult:
      type: object
      required:
        - attached
      properties:
        attached:
          type: boolean
          enum:
            - true
    DetachedResult:
      type: object
      required:
        - detached
      properties:
        detached:
          type: boolean
          enum:
            - true
    AssignedResult:
      type: object
      required:
        - assigned
      properties:
        assigned:
          type: boolean
          enum:
            - true
    UnassignedResult:
      type: object
      required:
        - unassigned
      properties:
        unassigned:
          type: boolean
          enum:
            - true
    Permission:
      type: object
      required:
        - id
        - action
        - subject
      properties:
        id:
          type: integer
          example: 1
        action:
          type: string
          example: read
        subject:
          type: string
          example: monitor
        description:
          type: string
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
    PermissionTuple:
      type: object
      required:
        - action
        - subject
      properties:
        action:
          type: string
          example: read
        subject:
          type: string
          example: monitor
    PermissionGroup:
      type: object
      required:
        - id
        - name
        - createdAt
        - permissions
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: operator
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    User:
      type: object
      required:
        - id
        - username
        - role
        - isRoot
        - enabled
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: admin
        role:
          type: string
          enum:
            - admin
            - operator
        isRoot:
          type: boolean
        enabled:
          type: boolean
        description:
          type: string
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    UserEnabledResult:
      type: object
      required:
        - id
        - username
        - enabled
      properties:
        id:
          type: integer
        username:
          type: string
        enabled:
          type: boolean
    AuthenticatedUser:
      type: object
      required:
        - id
        - sub
        - username
        - permissions
        - isRoot
      properties:
        id:
          type: integer
          example: 1
        sub:
          oneOf:
            - type: integer
            - type: string
          description: JWT subject
        username:
          type: string
          example: admin
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionTuple'
        isRoot:
          type: boolean
    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: 后台管理员 JWT
        user:
          type: object
          required:
            - id
            - username
            - role
          properties:
            id:
              type: integer
            username:
              type: string
            role:
              type: string
              enum:
                - admin
                - operator
    AccessTokenRecord:
      type: object
      required:
        - id
        - name
        - token
        - status
        - expiresAt
        - maximumUsageCount
        - usageCount
        - createdAt
        - projects
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: production-caller
        token:
          type: string
          description: 明文令牌；Access Token 使用 rk_，Device Token 使用 dk_。
        status:
          type: string
          enum:
            - active
            - revoked
        description:
          type: string
          nullable: true
        createdBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
