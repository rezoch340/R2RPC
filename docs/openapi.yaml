openapi: 3.0.0
paths:
  /device-tokens:
    post:
      operationId: DeviceTokenController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceTokenDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 生成 device token(返回明文,供 SDK 配置)
      tags:
        - device-token
    get:
      operationId: DeviceTokenController_list
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 列表:所有 device token(含明文、project 名、在线设备数)
      tags:
        - device-token
  /device-tokens/{id}/projects:
    patch:
      operationId: DeviceTokenController_updateProjects
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceTokenProjectsDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 替换 device token 的功能组作用域
      tags:
        - device-token
  /device-tokens/{id}/revoke:
    post:
      operationId: DeviceTokenController_revoke
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 撤销 device token
      tags:
        - device-token
  /device-tokens/{id}:
    delete:
      operationId: DeviceTokenController_delete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 删除 device token(软删,与撤销正交)
      tags:
        - device-token
  /projects:
    get:
      operationId: ProjectsController_list
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 功能组列表
      tags:
        - projects
    post:
      operationId: ProjectsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 创建功能组
      tags:
        - projects
  /projects/info:
    get:
      operationId: ProjectsController_info
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 功能组派生统计(设备数/在线/近7天/成功率/运行态)
      tags:
        - projects
  /projects/{id}:
    delete:
      operationId: ProjectsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 删除功能组
      tags:
        - projects
  /projects/{id}/enabled:
    post:
      operationId: ProjectsController_setEnabled
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnabledDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 启用/停用功能组(停用后 invoke 拒派)
      tags:
        - projects
  /metrics/overview:
    get:
      operationId: MetricsController_overview
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 指标总览(总量 / 成功失败 / 平均延迟 / 分状态 / 分组)
      tags:
        - metrics
  /metrics/weekly:
    get:
      operationId: MetricsController_weekly
      parameters:
        - name: project
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 近7天设备指标(按 clientId×project 汇总;可选 ?project)
      tags:
        - metrics
  /metrics/trend:
    get:
      operationId: MetricsController_trend
      parameters:
        - name: days
          required: false
          in: query
          description: 天数,1-90
          schema:
            default: 7
            type: number
        - name: project
          required: false
          in: query
          description: 按 project 过滤
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 按天趋势序列(默认近7天,缺天补零;可选 ?days ?project)
      tags:
        - metrics
  /devices:
    get:
      operationId: DevicesController_list
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 设备列表(持久态:online/status/platform/last_ip/last_seen)
      tags:
        - devices
  /devices/{id}:
    get:
      operationId: DevicesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 设备详情
      tags:
        - devices
  /rbac/roles:
    post:
      operationId: RbacController_createRole
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 创建权限组(仅种子管理员)
      tags:
        - rbac
    get:
      operationId: RbacController_listRoles
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 权限组列表(包含权限)
      tags:
        - rbac
  /rbac/roles/{id}:
    patch:
      operationId: RbacController_updateRole
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 编辑权限组(仅种子管理员)
      tags:
        - rbac
    delete:
      operationId: RbacController_deleteRole
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 删除权限组(仅种子管理员)
      tags:
        - rbac
  /rbac/permissions:
    post:
      operationId: RbacController_createPermission
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 创建权限(仅种子管理员)
      tags:
        - rbac
    get:
      operationId: RbacController_listPermissions
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 列表:所有权限
      tags:
        - rbac
  /rbac/permissions/{id}:
    delete:
      operationId: RbacController_deletePermission
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 删除权限(仅种子管理员)
      tags:
        - rbac
  /rbac/roles/{roleId}/permissions:
    post:
      operationId: RbacController_attachPermissionFromBody
      parameters:
        - name: roleId
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachPermissionDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 权限组配置权限(请求体形式,仅种子管理员)
      tags:
        - rbac
  /rbac/roles/{roleId}/permissions/{permissionId}:
    post:
      operationId: RbacController_attachPermission
      parameters:
        - name: roleId
          required: true
          in: path
          schema:
            type: number
        - name: permissionId
          required: true
          in: path
          schema:
            type: number
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 权限组配置权限(兼容 URL 形式,仅种子管理员)
      tags:
        - rbac
    delete:
      operationId: RbacController_detachPermission
      parameters:
        - name: roleId
          required: true
          in: path
          schema:
            type: number
        - name: permissionId
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 权限组移除权限(仅种子管理员)
      tags:
        - rbac
  /rbac/users/{userId}/roles:
    get:
      operationId: RbacController_listUserRoles
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 用户已分配的权限组
      tags:
        - rbac
    post:
      operationId: RbacController_assignRoleFromBody
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 用户分配权限组(请求体形式,仅种子管理员)
      tags:
        - rbac
  /rbac/users/{userId}/roles/{roleId}:
    post:
      operationId: RbacController_assignRole
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: number
        - name: roleId
          required: true
          in: path
          schema:
            type: number
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 用户分配权限组(兼容 URL 形式,仅种子管理员)
      tags:
        - rbac
    delete:
      operationId: RbacController_unassignRole
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: number
        - name: roleId
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 用户移除权限组(仅种子管理员)
      tags:
        - rbac
  /users:
    get:
      operationId: UsersController_list
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 用户列表
      tags:
        - users
    post:
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 创建用户
      tags:
        - users
  /users/{id}:
    get:
      operationId: UsersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 用户详情
      tags:
        - users
    patch:
      operationId: UsersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 修改用户资料(管理员账号只能由本人修改)
      tags:
        - users
    delete:
      operationId: UsersController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 删除用户(管理员账号只能由本人修改)
      tags:
        - users
  /users/{id}/password:
    patch:
      operationId: UsersController_setPassword
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 修改用户密码(管理员账号只能由本人修改)
      tags:
        - users
  /users/{id}/enabled:
    post:
      operationId: UsersController_setEnabled
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnabledDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 启用/停用用户(停用后禁止登录且立即吊销现有会话)
      tags:
        - users
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: ''
      summary: 管理员登录,返回 JWT
      tags:
        - auth
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 当前登录用户
      tags:
        - auth
  /access-tokens:
    post:
      operationId: AccessTokenController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessTokenDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 生成 access token(返回明文)
      tags:
        - access-token
    get:
      operationId: AccessTokenController_list
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 列表:所有 access token(含明文、project 名)
      tags:
        - access-token
  /access-tokens/{id}/projects:
    patch:
      operationId: AccessTokenController_updateProjects
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessTokenProjectsDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 替换 access token 的功能组作用域
      tags:
        - access-token
  /access-tokens/{id}/revoke:
    post:
      operationId: AccessTokenController_revoke
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 撤销 access token
      tags:
        - access-token
  /access-tokens/{id}:
    delete:
      operationId: AccessTokenController_delete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 删除 access token(软删,与撤销正交)
      tags:
        - access-token
  /rpc/invoke/{project}/{action}:
    post:
      operationId: RpcController_invoke
      parameters:
        - name: project
          required: true
          in: path
          schema:
            type: string
        - name: action
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: 调用 project 内在线设备执行 action(可选 ?clientId 指定设备)
      tags:
        - rpc
  /rpc/clientQueue:
    get:
      operationId: RpcController_clientQueue
      parameters:
        - name: project
          required: true
          in: query
          schema:
            type: string
        - name: clientId
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: project 内在线设备(或指定 clientId 的在线状态)
      tags:
        - rpc
  /monitor/requests:
    get:
      operationId: MonitorController_list
      parameters:
        - name: project
          required: false
          in: query
          schema:
            type: string
        - name: action
          required: false
          in: query
          schema:
            type: string
        - name: clientId
          required: false
          in: query
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
        - name: payloadState
          required: false
          in: query
          schema:
            type: string
        - name: minimumLatencyMs
          required: false
          in: query
          schema:
            type: number
        - name: maximumLatencyMs
          required: false
          in: query
          schema:
            type: number
        - name: from
          required: false
          in: query
          description: ISO 起始时间
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: ISO 结束时间
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: pageSize
          required: false
          in: query
          schema:
            maximum: 100
            default: 10
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 请求记录列表(查 PG 脊柱,不返 payload)
      tags:
        - monitor
  /monitor/request-options:
    get:
      operationId: MonitorController_requestOptions
      parameters:
        - name: project
          required: false
          in: query
          schema:
            type: string
        - name: action
          required: false
          in: query
          schema:
            type: string
        - name: clientId
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 请求筛选下拉选项(去重 project/action/client,联动过滤 + 实体仍存在)
      tags:
        - monitor
  /monitor/requests/{requestId}:
    get:
      operationId: MonitorController_detail
      parameters:
        - name: requestId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: 返回请求/响应 payload；设备上报且校验通过时 appAudit 为 V1 Step 结构，否则为 null
      security:
        - bearer: []
      summary: 请求详情(PG 脊柱 + 懒加载 Manticore payload/AppAudit)
      tags:
        - monitor
  /system-logs:
    get:
      operationId: SystemLogsController_list
      parameters:
        - name: name
          required: false
          in: query
          schema:
            type: string
        - name: actorUsername
          required: false
          in: query
          schema:
            type: string
        - name: action
          required: false
          in: query
          schema:
            type: string
        - name: subject
          required: false
          in: query
          schema:
            type: string
        - name: targetType
          required: false
          in: query
          schema:
            type: string
        - name: targetName
          required: false
          in: query
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - succeeded
              - failed
        - name: from
          required: false
          in: query
          description: ISO 起始时间
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: ISO 结束时间
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: pageSize
          required: false
          in: query
          schema:
            maximum: 100
            default: 10
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: 系统操作审计日志列表
      tags:
        - system-logs
info:
  title: RER0RPC API
  description: ''
  version: '0.1'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateDeviceTokenDto:
      type: object
      properties:
        name:
          type: string
        projects:
          type: array
          items:
            type: string
        expiresAt:
          type: string
        description:
          type: string
      required:
        - name
        - projects
    UpdateDeviceTokenProjectsDto:
      type: object
      properties:
        projects:
          description: 更新后的完整功能组名称列表
          type: array
          items:
            type: string
      required:
        - projects
    CreateProjectDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 255
      required:
        - name
    SetEnabledDto:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    CreateRoleDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 255
      required:
        - name
    UpdateRoleDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 255
    CreatePermissionDto:
      type: object
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 64
        subject:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 255
      required:
        - action
        - subject
    AttachPermissionDto:
      type: object
      properties:
        permissionId:
          type: number
          minimum: 1
      required:
