          schema:
            type: number
      responses:
        '200':
          description: 删除权限(仅种子管理员)成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
