        - name: name
          required: false
          in: query
          schema:
            type: string
        - name: actorUsername
          required: false
          in: query
          schema:
            type: string
        - name: action
          required: false
          in: query
          schema:
            type: string
        - name: subject
          required: false
          in: query
          schema:
            type: string
        - name: targetType
          required: false
          in: query
          schema:
            type: string
        - name: targetName
