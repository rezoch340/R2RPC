        - adminJwt: []
      summary: 指标总览(总量 / 成功失败 / 平均延迟 / 分状态 / 分组)
      tags:
        - metrics
      description: 指标总览(总量 / 成功失败 / 平均延迟 / 分状态 / 分组)。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /metrics/weekly:
    get:
      operationId: MetricsController_weekly
      parameters:
        - name: project
          required: false
          in: query
          description: 可选功能组名称；省略时返回全部功能组。
          schema:
            type: string
      responses:
        '200':
          description: 近7天设备指标(按 clientId×project 汇总;可选 ?project)成功。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyDeviceMetrics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 近7天设备指标(按 clientId×project 汇总;可选 ?project)
      tags:
        - metrics
      description: 近7天设备指标(按 clientId×project 汇总;可选 ?project)。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /metrics/trend:
    get:
      operationId: MetricsController_trend
      parameters:
        - name: days
          required: false
          in: query
          description: 天数,1-90
          schema:
            default: 7
            type: number
        - name: project
          required: false
          in: query
          description: 按 project 过滤
          schema:
            type: string
      responses:
        '200':
          description: 按天趋势序列(默认近7天,缺天补零;可选 ?days ?project)成功。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyTrendPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 按天趋势序列(默认近7天,缺天补零;可选 ?days ?project)
      tags:
        - metrics
      description: 按天趋势序列(默认近7天,缺天补零;可选 ?days ?project)。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
