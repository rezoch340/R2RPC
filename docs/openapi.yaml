    get:
      operationId: DevicesController_list
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 1000000
            default: 1
            type: integer
        - name: pageSize
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: integer
        - name: clientId
          required: false
          in: query
          description: 设备编号模糊匹配
          schema:
            type: string
        - name: platform
          required: false
          in: query
          description: 平台模糊匹配
          schema:
            type: string
        - name: lastIp
          required: false
          in: query
          description: 最后 IP 模糊匹配
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - online
              - offline
              - stale
      responses:
        '200':
          description: 设备列表(持久态:online/status/platform/last_ip/last_seen),服务端筛选分页成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 设备列表(持久态:online/status/platform/last_ip/last_seen),服务端筛选分页
      tags:
        - devices
      description: 设备列表(持久态:online/status/platform/last_ip/last_seen),服务端筛选分页。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /devices/{id}:
    get:
      operationId: DevicesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: 设备详情成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - adminJwt: []
      summary: 设备详情
      tags:
        - devices
      description: 设备详情。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /rbac/roles:
    post:
      operationId: RbacController_createRole
      parameters: []
      requestBody:
        required: true
