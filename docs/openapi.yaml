      security:
        - adminJwt: []
      summary: 删除权限组(仅种子管理员)
      tags:
        - rbac
      description: 删除权限组(仅种子管理员)。使用后台 JWT，并校验当前账号状态及对应 RBAC 权限。
  /rbac/permissions:
    post:
      operationId: RbacController_createPermission
      parameters: []
      requestBody:
        required: true
        content:
