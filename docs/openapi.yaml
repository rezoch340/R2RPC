  responses:
    BadRequest:
      description: 请求参数、路径参数或查询参数不符合契约。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 凭证缺失、无效、过期、撤销或对应账号已不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 凭证有效，但账号、功能组或 RBAC 权限不允许本次操作。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 目标资源不存在或已被软删除。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源名称或关联关系与现有数据冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Access Token 的 RPC 调用次数已经用尽。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 服务端发生未预期错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
